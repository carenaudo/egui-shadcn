[package]
name = "egui-shadcn-web-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
egui = "0.33"
egui-shadcn = { path = ".." }
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
